version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: your-secret-key-change-in-production
      # Add more environment variables as needed
    volumes:
      - ./backend/farming_tech.db:/app/backend/farming_tech.db
    restart: unless-stopped

